name: Generate ICONS client deliverables

on:
  push:
    paths:
      - "clients/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icons-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        working-directory: my-agent
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r my-agent/scripts/requirements.txt

      - name: Run ICONS generation pipeline
        working-directory: my-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Commit generated deliverables
        run: |
          git config user.name "icons-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clients/ deliverables/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate ICONS client deliverables [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
